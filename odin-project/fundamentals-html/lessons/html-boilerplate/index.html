<!-- Informa a versao do HTML que o navegador deve renderizar a pagina -->
<!DOCTYPE html>
<!-- Tag mae de onde descende todos os outros elementos (metadados e body) -->
<html lang="pt-BR">
    <!-- Contem metadados (nada que e exibido dentro da página) que ajudam a pesquisa 
     do navegador e como os elementos da pagina devem ser renderizados -->
    <head>
        <!-- Codificacao com acentos -->
        <meta charset="UTF-8">
        <!-- Ajuda a responsividade mobile -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- O titulo da pagina -->
        <title>My first web page</title>
        <!-- Link da pagina com o arquivo CSS que estiliza ela-->
        <link rel="stylesheet" href="styles.css">    
    </head>
    <!-- Body mantem todo o conteudo visivel da pagina -->
    <body>
        <h1>Hello, world!</h1>
    </body>
</html>
